name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、走っている検査は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 型・コンテンツ・ビルドは全体で 1 回だけ見ればよい。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Type check
        run: npx tsc --noEmit

      - name: Check content integrity
        run: npm run check

      - name: Build
        run: npm run build

  # smoke は部ごとに分けて並列に走らせる。
  # 全章を 1 つのジョブで踏むと、章が増えるほど直線的に伸びて CI が待てなくなる。
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [basics, math3d, threejs, project, polish]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # smoke で実際にブラウザを動かすので、ここでは Chromium の取得を止めない。
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 3D は SwiftShader のソフトウェア描画で走る（smoke.ts が起動時に指定している）。
      - name: Smoke
        run: npm run smoke -- --part=${{ matrix.part }}

      # 失敗したときだけ、目で見るためのスクリーンショットを残す。
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ matrix.part }}
          path: artifacts/
          retention-days: 7
