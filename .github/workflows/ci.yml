name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、走っている検査は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # smoke で実際にブラウザを動かすので、ここでは Chromium の取得を止めない。
      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check content integrity
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 3D は SwiftShader のソフトウェア描画で走る（smoke.ts が起動時に指定している）。
      - name: Smoke
        run: npm run smoke

      # 失敗したときだけ、目で見るためのスクリーンショットを残す。
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: artifacts/
          retention-days: 7
