<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>(アイン、ソフ、オウル) — Three.js のための数学</title>
    <meta
      name="description"
      content="数学の知識がゼロでも大丈夫。数直線と割合から始めて、Three.js を書くために必要な数学だけを 3D デモを触りながら学び、そのまま実装・作品づくり・仕上げまで進む全187章の学習サイトです。"
    />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="(アイン、ソフ、オウル)" />
    <meta property="og:title" content="(アイン、ソフ、オウル) — Three.js のための数学" />
    <meta
      property="og:description"
      content="数学の予備知識ゼロから、作品を人に見せられる形にするところまで。全187章・演習561問。数式には実際の数字での計算例が付き、第3部より後のコードはページの中で書き換えて実行できます。"

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // 描画前にテーマを確定させ、リロード時の白い一瞬（FOUC）を防ぐ。
      // このサイトはダークを既定の見た目とし、明示的に切り替えたときだけライトにする。
      (function () {
        try {
          var saved = localStorage.getItem('webgl-manabe:theme');
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        このサイトは 3D デモを動かすために JavaScript を使います。有効にしてから開き直してください。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
